server:
  servlet:
    context-path: /api/v1/sender
  port: ${BACKEND_PORT:8084}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sender}
    username: ${DB_USERNAME:sender}
    password: ${DB_PASSWORD:sender}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER_URL:https://sso.roadmaps-nikval.ru/realms/roadmaps}

management:
  endpoints:
    web:
      exposure:
        include: "*"

org:
  jobrunr:
    background-job-server:
      enabled: true
    dashboard:
      enabled: true